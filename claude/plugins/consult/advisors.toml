# Advisor roster for `consult`.
# Edit this file to reconfigure the panel. Nothing else needs to change.
# Validate slugs against the live OpenRouter catalog with: consult --check

[defaults]
timeout = 240            # seconds per seat
max_issues = 3           # cap on issues returned per advisor
require_parameters = true  # never route to a provider that silently drops reasoning/schema params
data_collection = "allow"  # flip to "deny" to avoid providers that may train on your data

# Live web search. Only seats with web = "native" below can search; this default
# exists so `--web` has something to switch on and is otherwise inert.
#
# Why native only, and never OpenRouter's exa fallback: exa builds its query from the
# user message, which for us is a whole artifact. Measured with a 4KB artifact, exa
# returned BBC coverage of a Russian strike near Kyiv and an Amazon data centre story,
# and the advisor then answered wrong at HIGH confidence. Native search is model-driven
# -- the advisor writes its own queries -- and every native seat tested got it right.
#
# Search is model-elected, so it only costs when it fires. Measured: on a
# version-sensitive question grok went $0.005 -> $0.054 (22 citations) and gemini
# $0.050 -> $0.127; on a pure-logic artifact needing no external facts, grok cited
# nothing at $0.009 and gemini came in at $0.019 against a $0.053 offline baseline
# -- i.e. below it, because reasoning-token variance is larger than the search fee.
# So leaving this on costs roughly nothing on questions that do not need it, and a
# few cents on the ones that do. --no-web forces every seat offline for a run.
web = "native"


# ---------------------------------------------------------------------------
# Lenses — the job the advisor is doing. Decoupled from the model on purpose:
# for non-code questions the lens drives more variance than the model does.
# ---------------------------------------------------------------------------
[lenses]

red-team = """
You are the red team. Assume the proposal is wrong and look for the reason.
Prioritise: incorrect assumptions, unhandled failure modes, security and data
integrity, things that work now but break under load, concurrency or scale.
Do not comment on style. Do not praise anything."""

blast-radius = """
You assess second-order consequences. What else does this touch that the
author has not considered? Coupling, migration and rollback paths, downstream
consumers, operational burden, what this costs to maintain in six months.
You care about the system, not the change in isolation."""

contrarian = """
You interrogate the premise, not the execution. Is this the right problem?
Is there a materially simpler option being skipped? What is the strongest
honest case AGAINST doing this at all? If the premise is sound, say so
plainly and move on -- do not manufacture disagreement."""

conformance = """
You check the proposal against what was actually asked for. Look for scope
drift, requirements silently dropped, unstated assumptions, and answers to a
question adjacent to the one posed. You are not judging quality, only fit."""

prose = """
You judge writing: clarity, structure, tone, and whether it lands with its
intended reader. Flag padding, hedging, buried leads, and claims the text has
not earned. Quote the specific line when you object."""

correctness = """
You verify reasoning step by step. Check logic, arithmetic, cited facts, and
whether stated conclusions follow from stated premises. Flag anything asserted
without support."""

strategy = """
You evaluate this as a decision under uncertainty. What does it cost if wrong,
how reversible is it, what is the option value of waiting, and what is the
cheapest experiment that would resolve the main uncertainty? Name the tradeoff
being made, especially if the author has not."""


# ---------------------------------------------------------------------------
# Core seats — proprietary frontier models. These are the default panel members.
# Rationale: sycophancy benchmarks show the best open-weight model still ranks
# below the weakest proprietary one. An advisor that agrees too readily is worse
# than no advisor, so dissent comes from here; open weights add diversity only.
# ---------------------------------------------------------------------------

[seats.sol]
model = "openai/gpt-5.6-sol"
effort = "high"
lens = "red-team"
web = "native"
note = "$2/$10 - hardest reasoning tier, lowest-sycophancy family on BrokenMath"

[seats.gemini]
model = "google/gemini-3.1-pro-preview"
effort = "high"
lens = "blast-radius"
web = "native"             # searches, but returns no url_citation annotations
note = "$2/$12, 1M ctx - leads GPQA Diamond 94.3%, ARC-AGI-2 77.1%"

[seats.grok]
model = "x-ai/grok-4.3"
effort = "high"
lens = "contrarian"
web = "native"             # also searches X; cites heavily, ~20 sources per call
note = "$1.25/$2.50, 1M ctx - different lab entirely, cheapest frontier seat"

[seats.fable]
kind = "subagent"          # runs on the Claude Max plan, not OpenRouter
model = "fable"            # OpenRouter lists claude-fable-5.1 at $10/$50; this seat is free
lens = "conformance"
# No web key: this seat is a Claude Code subagent and already has WebSearch/WebFetch.
note = "Claude Fable 5.1 via subagent - composite leader, top writing Elo"


# ---------------------------------------------------------------------------
# Specialist seats — invoked by name, not in the default panels.
#
# Seats without a `web` key have no first-party search at their provider and stay
# offline on purpose. Do not add web = "native" to one hoping it works: OpenRouter
# silently falls back to exa, which is worse than no search on artifact-sized input.
# Use them for reasoning and arithmetic, not for current facts.
# ---------------------------------------------------------------------------

[seats.kimi]
model = "moonshotai/kimi-k3"
effort = "high"
lens = "prose"
note = "$3/$15, 1M ctx - tops EQ-Bench Creative Writing"

[seats.muse]
model = "meta/muse-spark-1.2"
lens = "prose"
note = "$1.25/$4.25 - near-frontier writing at value price"

[seats.codex]
model = "openai/gpt-5.3-codex"
effort = "high"
lens = "red-team"
web = "native"
note = "$1.75/$14 - code specialist, do not use for non-code questions"

[seats.astra]
model = "openai/gpt-6-astra"
effort = "high"
lens = "red-team"
web = "native"
note = "$10/$50 - 5x the sol seat, max panel only"

[seats.grok-45]
model = "x-ai/grok-4.6"
effort = "high"
lens = "contrarian"
web = "native"
note = "$2/$6, 500K ctx - xAI newest, for hard calls"

[seats.glm]
model = "z-ai/glm-5.2"
effort = "high"
lens = "correctness"
quantizations = ["bf16", "fp8"]
note = "$1.19/$3.74, 1M ctx, MIT - #1 open-weight"

[seats.deepseek]
model = "deepseek/deepseek-v4-pro-0813"
effort = "high"
lens = "correctness"
quantizations = ["bf16", "fp8"]
note = "$0.66/$1.98 - GA build, cheapest serious reasoning"

[seats.minimax]
model = "minimax/minimax-m3"
quantizations = ["bf16", "fp8"]
lens = "correctness"
note = "$0.30/$1.20 - throughput tier"


# ---------------------------------------------------------------------------
# Panels — named (seat, lens) sets. `consult --panel decision`
# ---------------------------------------------------------------------------
[panels]
code     = ["sol", "codex", "fable"]
decision = ["sol", "grok", "gemini", "fable"]
writing  = ["fable", "kimi", "sol"]
cheap    = ["glm", "deepseek", "grok"]
max      = ["astra", "gemini", "grok-45", "kimi", "fable"]

# Lens overrides per panel: seat keeps its model, swaps its job.
[panel_lenses]
decision = { sol = "red-team", grok = "strategy", gemini = "blast-radius", fable = "conformance" }
writing  = { sol = "correctness", kimi = "prose", fable = "prose" }
